# PostgreSQL Configuration with pgAudit Extension
# This file is mounted into the container at /etc/postgresql/custom.conf

# ============================================================================
# BASIC SETTINGS
# ============================================================================

# Listen on all interfaces (allow external connections)
listen_addresses = '*'

# Maximum number of connections
max_connections = 100

# Shared buffers (memory for caching)
shared_buffers = 128MB


# ============================================================================
# EXTENDED LOGGING (Phase 1 Requirement)
# ============================================================================

# TODO: Set log_statement to 'all' to log every SQL statement
# Options: none, ddl, mod, all
log_statement = 'all'

# TODO: Enable log_duration to record query execution time
log_duration = on

# Log minimum duration statement (0 = log all, -1 = disabled)
log_min_duration_statement = 0

# Log line prefix with useful information
# Format: timestamp, user, database, process ID, application name
log_line_prefix = '%m [%p] %u@%d '

# Log timestamps with milliseconds
log_timezone = 'UTC'

# Log connection/disconnection events
log_connections = on
log_disconnections = on

# Log lock waits
log_lock_waits = on


# ============================================================================
# LOG ROTATION (Phase 1 Requirement)
# ============================================================================

# TODO: Configure log rotation age (how often to create new log file)
# Options: 1d (daily), 1h (hourly), etc.
log_rotation_age = 1d

# TODO: Set log filename pattern with timestamp
log_filename = 'postgresql-%Y-%m-%d.log'

# Log file size limit (rotate if exceeded)
log_rotation_size = 100MB

# Truncate existing log files on rotation
log_truncate_on_rotation = on


# ============================================================================
# CSV LOG OUTPUT (Required for ETL parsing)
# ============================================================================

# Log destination: stderr and csvlog
log_destination = 'stderr,csvlog'

# Logging collector (enables file output)
logging_collector = on

# Log directory (inside container)
log_directory = '/var/log/postgresql/logs'

# Log file format: csvlog for easy parsing
# CSV logs will be in log_directory with pattern postgresql-*.csv


# ============================================================================
# PGAUDIT EXTENSION (Phase 1 - Most Important)
# ============================================================================

# TODO: Load pgAudit library at startup
# This must be in shared_preload_libraries
shared_preload_libraries = 'pgaudit'

# TODO: Configure pgAudit logging level
# Options: debug5, debug1, info, notice, warning, log
pgaudit.log_level = 'log'

# TODO: Configure pgAudit to log DDL, WRITE (DML), and ROLE operations
# DDL: CREATE, ALTER, DROP, TRUNCATE
# WRITE: INSERT, UPDATE, DELETE
# ROLE: GRANT, REVOKE, CREATE ROLE, ALTER ROLE, DROP ROLE
# READ: SELECT (optional, can be very verbose)
pgaudit.log = 'ddl,write,role'

# Log parameter values in statements (for security audit)
pgaudit.log_parameter = on

# Log catalog queries (information_schema, pg_catalog)
pgaudit.log_catalog = off

# Log specific relations (tables) - comma-separated schema.table
# pgaudit.log_relation = 'public.users,public.orders'

# Session-level pgAudit settings (can be overridden per role)
# pgaudit.role = 'pgaudit_admin'


# ============================================================================
# PERFORMANCE SETTINGS (For analytics workload)
# ============================================================================

# Work memory for sorting and hashing
work_mem = 4MB

# Maintenance work memory (for VACUUM, CREATE INDEX)
maintenance_work_mem = 64MB

# Effective cache size (for query planner)
effective_cache_size = 512MB

# Random page cost (lower for SSD)
random_page_cost = 1.1


# ============================================================================
# AUTOVACUUM SETTINGS
# ============================================================================

# Enable autovacuum
autovacuum = on

# Autovacuum frequency
autovacuum_naptime = 1min

# Threshold for triggering autovacuum
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Scale factor (percentage of table size)
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
